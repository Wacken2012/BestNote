name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v2.0.0). If empty, the workflow will use the ref that triggered it.'
        required: false

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release notes
        id: notes
        run: |
          # Determine tag (strip refs/tags/ if necessary)
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG_REF="${GITHUB_REF:-""}"
            if [ -z "$TAG_REF" ]; then
              TAG=""
            else
              TAG="${TAG_REF#refs/tags/}"
            fi
          fi
          echo "Using tag: $TAG"
          # fallback: if no tag found, try github.ref_name
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME:-""}"
          fi
          # normalize without leading v for CHANGELOG matching
          TAGCORE=${TAG#v}
          echo "Looking up changelog section for ${TAGCORE}"
          awk "/^## \[${TAGCORE}\]/{flag=1;next}/^## \[/{if(flag) exit}flag{print}" CHANGELOG.md > release_notes.md || true
          if [ ! -s release_notes.md ]; then
            # fallback to whole CHANGELOG
            cp CHANGELOG.md release_notes.md
          fi
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          cat release_notes.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          release_name: "BestNote ${{ github.event.inputs.tag || github.ref_name }}"
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false

      - name: Upload CHANGELOG.md as asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: CHANGELOG.md
          asset_name: CHANGELOG.md
          asset_content_type: text/markdown
